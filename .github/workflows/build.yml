name: build-dylib

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version || true
          clang --version | head -n 1

      - name: Install Theos
        run: |
          set -euo pipefail
          THEOS_DIR="$HOME/theos"
          echo "THEOS=$THEOS_DIR" >> "$GITHUB_ENV"
          echo "$THEOS_DIR/bin" >> "$GITHUB_PATH"

          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS_DIR"
          mkdir -p "$THEOS_DIR/sdks"

          curl -fL -o /tmp/sdks.tar.gz \
            https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar xzf /tmp/sdks.tar.gz -C /tmp
          cp -R /tmp/sdks-master/*.sdk "$THEOS_DIR/sdks/" || true
          ls "$THEOS_DIR/sdks/"

      - name: Install ldid
        run: |
          set -euo pipefail
          brew install ldid || true
          which ldid || echo "ldid not found"

      - name: Build FFmpeg (arm64 iOS)
        run: |
          set -euo pipefail
          chmod +x scripts/build-ffmpeg-ios.sh
          ./scripts/build-ffmpeg-ios.sh
          echo "--- ffmpeg libs ---"
          ls -lh vendor/ffmpeg-ios/lib | head -20

      - name: Build
        run: |
          set -euo pipefail
          make clean || true
          make -j4

      - name: Verify
        run: |
          set -euo pipefail
          DY=$(find .theos/obj -name 'BXFloatVCam.dylib' -type f | head -n1)
          if [ -z "$DY" ]; then
            echo "::error::BXFloatVCam.dylib not produced"
            exit 1
          fi
          echo "artifact: $DY"
          file "$DY"
          echo "--- install_name ---"
          otool -D "$DY"
          echo "--- dependencies ---"
          otool -L "$DY"

          ldid -S "$DY" || true

          mkdir -p dist
          cp -f "$DY" dist/BXFloatVCam.dylib
          shasum -a 256 dist/BXFloatVCam.dylib

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BXFloatVCam-dylib
          path: dist/BXFloatVCam.dylib
          if-no-files-found: error
